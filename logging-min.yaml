version: 1
disable_existing_loggers: true

formatters:
  default:
    format: "%(asctime)s.%(msecs)03d <%(process)d:%(processName)s> %(levelname)s %(name)s %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]
  propagate: yes

loggers:
  asyncio:
    level: INFO
    #handlers: [console]
    #propagate: no
  fastapi:
    level: INFO
    #handlers: [console]
    #propagate: no
  fastapi_cli:
    level: INFO
    #handlers: [console]
    #propagate: no
  httpcore:
    level: INFO
  httpx:
    level: WARNING
  simultons:
    level: INFO
  simultons.simulation:
    level: INFO
  tests:
    level: INFO
    #handlers: [console]
    #propagate: no
  uvicorn:
    level: INFO
    #handlers: [console]
    #propagate: no
  werkzeug:
    level: INFO
    #handlers: [console]
    #propagate: no
